<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Renka</title>
<!-- 스토어 이동 계측용 경유 페이지.
     Cloudflare Web Analytics 는 페이지뷰만 세고 클릭 이벤트가 없어서, 스토어로 나가는
     클릭을 셀 방법이 없었다. 여기를 한 번 거치게 해 /go/googleplay 페이지뷰로 잡는다.
     캠페인 값은 각 언어 페이지의 통과 스크립트가 sessionStorage 에 넣어둔 것을 읽는다
     (같은 오리진이라 그대로 보인다). 없으면 기본 스토어 주소로 보낸다. -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "ba73547384174772b4b3b8938d8c6406"}'></script>
<style>
  html,body{margin:0;height:100%;background:#F7F5F2;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#6B6259}
  .w{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  a{color:#3E7D53}
</style>
</head>
<body><div class="w"><p>…<br><a id="f" href="https://play.google.com/store/apps/details?id=com.fattail.renka">Continue</a></p></div>
<script>
(function () {
    var APPLE_PT = '128379849', APPLE_ID = '6756908316';
    var KIND = 'googleplay';
    var p = {};
    try { p = JSON.parse(sessionStorage.getItem('renka_campaign') || '{}'); } catch (e) {}
    // 유입 파라미터가 URL 로 직접 넘어온 경우도 받는다(세션이 비었을 때의 보험)
    new URLSearchParams(location.search).forEach(function (v, k) { if (!p[k]) p[k] = v; });

    function slug(v) {   // 애플 ct 는 40자 + 영숫자/._- 만 안전
        var o = (v || '').replace(/[^A-Za-z0-9._-]/g, '-').slice(0, 40);
        return /[A-Za-z0-9]/.test(o) ? o : '';
    }
    var url;
    if (KIND === 'appstore') {
        var ct = slug(p.utm_campaign) || slug(p.utm_source);
        url = 'https://apps.apple.com/app/apple-store/id' + APPLE_ID +
              (ct ? '?pt=' + encodeURIComponent(APPLE_PT) + '&ct=' + encodeURIComponent(ct) + '&mt=8' : '');
    } else {
        var keys = Object.keys(p);
        var ref = keys.length ? encodeURIComponent(keys.map(function (k) { return k + '=' + p[k]; }).join('&')) : '';
        url = 'https://play.google.com/store/apps/details?id=com.fattail.renka' +
              (ref ? '&referrer=' + ref : '');
    }
    document.getElementById('f').href = url;
    // 비컨이 페이지뷰를 보낼 틈을 준 뒤 넘긴다. replace 라 뒤로가기에 남지 않는다.
    setTimeout(function () { location.replace(url); }, 350);
})();
</script>
</body></html>
